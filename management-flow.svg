<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker>
<marker id="arrb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f5fa8"/></marker>
</defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="20" y="46" font-size="24" font-weight="bold" fill="#222">Managing the solution: how one requirement moves through the registers</text>
<text x="20" y="68" font-size="13" fill="#666">Design authority is ours; the vendor is consulted and implements on their side. Solid arrows: record to record. Dashed blue: work goes through an open item. Every record carries Implemented by: vendor / internal.</text>
<rect x="20" y="80" width="1560" height="120" rx="6" fill="#e8f1fb" fill-opacity="0.35" stroke="none"/>
<rect x="20" y="80" width="140" height="120" rx="6" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1"/>
<text x="90" y="139.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5fa8">OPEN ITEMS</text>
<text x="90" y="155.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5fa8">the queue</text>
<rect x="20" y="220" width="1560" height="110" rx="6" fill="#fff8e6" fill-opacity="0.35" stroke="none"/>
<rect x="20" y="220" width="140" height="110" rx="6" fill="#fff8e6" stroke="#c77d00" stroke-width="1"/>
<text x="90" y="280.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#c77d00">REQUIREMENTS</text>
<rect x="20" y="350" width="1560" height="110" rx="6" fill="#eef7ea" fill-opacity="0.35" stroke="none"/>
<rect x="20" y="350" width="140" height="110" rx="6" fill="#eef7ea" stroke="#3a7d2c" stroke-width="1"/>
<text x="90" y="410.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a7d2c">DECISIONS</text>
<rect x="20" y="480" width="1560" height="110" rx="6" fill="#fdecec" fill-opacity="0.35" stroke="none"/>
<rect x="20" y="480" width="140" height="110" rx="6" fill="#fdecec" stroke="#b83232" stroke-width="1"/>
<text x="90" y="540.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#b83232">LIMITATIONS</text>
<rect x="20" y="610" width="1560" height="110" rx="6" fill="#e6f4f6" fill-opacity="0.35" stroke="none"/>
<rect x="20" y="610" width="140" height="110" rx="6" fill="#e6f4f6" stroke="#1a7f8e" stroke-width="1"/>
<text x="90" y="664.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f8e">CHANGE</text>
<text x="90" y="680.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f8e">REQUESTS</text>
<rect x="20" y="740" width="1560" height="110" rx="6" fill="#f3eefb" fill-opacity="0.35" stroke="none"/>
<rect x="20" y="740" width="140" height="110" rx="6" fill="#f3eefb" stroke="#6a3fa0" stroke-width="1"/>
<text x="90" y="800.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#6a3fa0">RISKS</text>
<rect x="172" y="112" width="258" height="76" rx="8" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.5"/><text x="301" y="184" text-anchor="middle" font-size="10.5" fill="#333">Event: risk lands or assumption fails (OI)</text>
<text x="301" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Four entry points</text>
<text x="301" y="146" text-anchor="middle" font-size="10.5" fill="#333">Requirement: we need it (REQ)</text><text x="301" y="159" text-anchor="middle" font-size="10.5" fill="#333">Discovery: platform does / does not (LIM, DEC)</text><text x="301" y="172" text-anchor="middle" font-size="10.5" fill="#333">Ask: stakeholder wants change (OI, then CR / REQ)</text>
<rect x="440" y="112" width="220" height="64" rx="8" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="550.0" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">OI Open</text>
<text x="550.0" y="158" text-anchor="middle" font-size="11.5" fill="#555">owner, next action, due date</text>
<rect x="700" y="112" width="200" height="64" rx="8" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="800.0" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">OI In progress / Blocked</text>
<text x="800.0" y="158" text-anchor="middle" font-size="11.5" fill="#555">work it; Blocked needs Blocked by</text>
<rect x="940" y="112" width="240" height="64" rx="8" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="1060.0" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">OI Closed</text>
<text x="1060.0" y="158" text-anchor="middle" font-size="11.5" fill="#555">resolution = the record it created or changed</text>
<rect x="1230" y="112" width="330" height="64" rx="8" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="1395.0" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Meeting: walk Register: Outstanding</text>
<text x="1395.0" y="158" text-anchor="middle" font-size="11.5" fill="#555">every OI gets a new next action, or closes</text>
<circle cx="1230" cy="112" r="12" fill="#1f5fa8"/><text x="1230" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">9</text>
<path d="M430,144 L440,144" stroke="#1f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
<path d="M660,144 L700,144" stroke="#1f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
<path d="M900,144 L940,144" stroke="#1f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
<path d="M1180,144 L1230,144" stroke="#1f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
<path d="M1395,112 L1395,96 L550,96 L550,112" stroke="#1f5fa8" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
<text x="970" y="92" text-anchor="middle" font-size="11.5" fill="#1f5fa8">the loop runs again after every meeting</text>
<path d="M300,210 L1040,210" stroke="#1f5fa8" stroke-width="1.4" stroke-dasharray="6,4" fill="none"/>
<path d="M550,210 L550,176" stroke="#1f5fa8" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
<text x="300" y="204" text-anchor="start" font-size="11.5" fill="#1f5fa8">raise an open item (steps 2, 4, 8, and every ask or event)</text>
<rect x="180" y="243" width="200" height="64" rx="8" fill="#fff8e6" stroke="#c77d00" stroke-width="1.5"/>
<text x="280.0" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">REQ Agreed</text>
<text x="280.0" y="289" text-anchor="middle" font-size="11.5" fill="#555">stakeholders agree; vendor consulted</text>
<circle cx="180" cy="243" r="12" fill="#c77d00"/><text x="180" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
<rect x="560" y="243" width="200" height="64" rx="8" fill="#fff8e6" stroke="#c77d00" stroke-width="1.5"/>
<text x="660.0" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">REQ Designed</text>
<text x="660.0" y="289" text-anchor="middle" font-size="11.5" fill="#555">the design covers it; DEC only if chosen</text>
<circle cx="560" cy="243" r="12" fill="#c77d00"/><text x="560" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
<rect x="1120" y="243" width="200" height="64" rx="8" fill="#e6f4f6" stroke="#1a7f8e" stroke-width="1.5"/>
<text x="1220.0" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CR Deferred</text>
<text x="1220.0" y="289" text-anchor="middle" font-size="11.5" fill="#555">named later phase, triggered by the LIM</text>
<circle cx="1120" cy="243" r="12" fill="#c77d00"/><text x="1120" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6c</text>
<rect x="1360" y="243" width="200" height="64" rx="8" fill="#fff8e6" stroke="#c77d00" stroke-width="1.5"/>
<text x="1460.0" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">REQ Delivered &gt; Verified</text>
<text x="1460.0" y="289" text-anchor="middle" font-size="11.5" fill="#555">we test it, then close</text>
<circle cx="1360" cy="243" r="12" fill="#c77d00"/><text x="1360" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">7</text>
<path d="M660,243 L660,232 L1460,232 L1460,243" stroke="#c77d00" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<text x="900" y="228" text-anchor="middle" font-size="11.5" fill="#c77d00">vendor builds the normal path</text>
<rect x="330" y="373" width="200" height="64" rx="8" fill="#eef7ea" stroke="#3a7d2c" stroke-width="1.5"/>
<text x="430.0" y="401" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">DEC Proposed</text>
<text x="430.0" y="419" text-anchor="middle" font-size="11.5" fill="#555">addresses REQ; raise an OI to review</text>
<circle cx="330" cy="373" r="12" fill="#3a7d2c"/><text x="330" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
<rect x="560" y="373" width="200" height="64" rx="8" fill="#eef7ea" stroke="#3a7d2c" stroke-width="1.5"/>
<text x="660.0" y="401" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">DEC Accepted</text>
<text x="660.0" y="419" text-anchor="middle" font-size="11.5" fill="#555">approver signs off after consulting</text>
<circle cx="560" cy="373" r="12" fill="#3a7d2c"/><text x="560" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
<rect x="1120" y="373" width="200" height="64" rx="8" fill="#eef7ea" stroke="#3a7d2c" stroke-width="1.5"/>
<text x="1220.0" y="401" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">DEC Accepted (accept LIM)</text>
<text x="1220.0" y="419" text-anchor="middle" font-size="11.5" fill="#555">rationale for living with it</text>
<circle cx="1120" cy="373" r="12" fill="#3a7d2c"/><text x="1120" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6a</text>
<path d="M380,275 L430,373" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="420" y="330" text-anchor="middle" font-size="11.5" fill="#555">vendor proposes</text>
<path d="M530,405 L560,405" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M660,373 L660,307" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="670" y="345" text-anchor="start" font-size="11.5" fill="#555">REQ Designed</text>
<path d="M430,373 L430,215" stroke="#1f5fa8" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
<rect x="560" y="503" width="200" height="64" rx="8" fill="#fdecec" stroke="#b83232" stroke-width="1.5"/>
<text x="660.0" y="531" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">LIM Identified</text>
<text x="660.0" y="549" text-anchor="middle" font-size="11.5" fill="#555">discovery, or introduced by a DEC</text>
<circle cx="560" cy="503" r="12" fill="#b83232"/><text x="560" y="507" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>
<rect x="800" y="503" width="200" height="64" rx="8" fill="#fdecec" stroke="#b83232" stroke-width="1.5"/>
<text x="900.0" y="531" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">LIM Under assessment</text>
<text x="900.0" y="549" text-anchor="middle" font-size="11.5" fill="#555">assessed inside an OI</text>
<circle cx="800" cy="503" r="12" fill="#b83232"/><text x="800" y="507" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text>
<rect x="1120" y="503" width="200" height="64" rx="8" fill="#fdecec" stroke="#b83232" stroke-width="1.5"/>
<text x="1220.0" y="531" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">LIM Resolved</text>
<text x="1220.0" y="549" text-anchor="middle" font-size="11.5" fill="#555">vendor fixed it, evidence noted</text>
<circle cx="1120" cy="503" r="12" fill="#b83232"/><text x="1120" y="507" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6d</text>
<path d="M660,437 L660,503" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="670" y="475" text-anchor="start" font-size="11.5" fill="#555">design shows a gap</text>
<path d="M760,535 L800,535" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M760,512 L775,512 L775,215" stroke="#1f5fa8" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
<rect x="1056" y="255" width="8" height="430" rx="3" fill="#b83232"/>
<text x="1047" y="470" text-anchor="middle" font-size="11" fill="#b83232" font-weight="bold" transform="rotate(-90 1047 470)">DISPOSITION: exactly one path</text>
<path d="M1000,535 L1056,535" stroke="#b83232" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M1064,275 L1120,275" stroke="#b83232" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="1092" y="268" text-anchor="middle" font-size="10.5" fill="#b83232">defer</text>
<path d="M1064,405 L1120,405" stroke="#b83232" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="1092" y="398" text-anchor="middle" font-size="10.5" fill="#b83232">accept</text>
<path d="M1064,535 L1120,535" stroke="#b83232" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="1092" y="528" text-anchor="middle" font-size="10.5" fill="#b83232">resolved</text>
<path d="M1064,665 L1120,665" stroke="#b83232" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="1092" y="658" text-anchor="middle" font-size="10.5" fill="#b83232">change</text>
<rect x="1120" y="633" width="225" height="64" rx="8" fill="#e6f4f6" stroke="#1a7f8e" stroke-width="1.5"/>
<text x="1232.5" y="661" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">CR Proposed &gt; Options &gt; For approval</text>
<text x="1232.5" y="679" text-anchor="middle" font-size="11.5" fill="#555">ways to make the change, each with impact</text>
<circle cx="1120" cy="633" r="12" fill="#1a7f8e"/><text x="1120" y="637" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6b</text>
<rect x="1360" y="633" width="200" height="64" rx="8" fill="#e6f4f6" stroke="#1a7f8e" stroke-width="1.5"/>
<text x="1460.0" y="661" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CR Approved &gt; Delivered</text>
<text x="1460.0" y="679" text-anchor="middle" font-size="11.5" fill="#555">if withdrawn or rejected, LIM back to assessment</text>
<circle cx="1360" cy="633" r="12" fill="#1a7f8e"/><text x="1360" y="637" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">7</text>
<path d="M1345,665 L1360,665" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M1460,633 L1460,307" stroke="#1a7f8e" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="1470" y="470" text-anchor="start" font-size="11.5" fill="#1a7f8e">delivers the REQ</text>
<rect x="560" y="763" width="200" height="64" rx="8" fill="#f3eefb" stroke="#6a3fa0" stroke-width="1.5"/>
<text x="660.0" y="791" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RSK Identified</text>
<text x="660.0" y="809" text-anchor="middle" font-size="11.5" fill="#555">raised by a DEC or a review</text>
<circle cx="560" cy="763" r="12" fill="#6a3fa0"/><text x="560" y="767" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>
<rect x="800" y="763" width="200" height="64" rx="8" fill="#f3eefb" stroke="#6a3fa0" stroke-width="1.5"/>
<text x="900.0" y="791" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RSK Mitigating</text>
<text x="900.0" y="809" text-anchor="middle" font-size="11.5" fill="#555">trigger, mitigation, review date</text>
<circle cx="800" cy="763" r="12" fill="#6a3fa0"/><text x="800" y="767" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>
<rect x="1040" y="763" width="200" height="64" rx="8" fill="#f3eefb" stroke="#6a3fa0" stroke-width="1.5"/>
<text x="1140.0" y="791" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RSK Realised</text>
<text x="1140.0" y="809" text-anchor="middle" font-size="11.5" fill="#555">spawns an OI, then Retired</text>
<circle cx="1040" cy="763" r="12" fill="#6a3fa0"/><text x="1040" y="767" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>
<rect x="1280" y="763" width="200" height="64" rx="8" fill="#f3eefb" stroke="#6a3fa0" stroke-width="1.5"/>
<text x="1380.0" y="791" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">RSK Retired</text>
<text x="1380.0" y="809" text-anchor="middle" font-size="11.5" fill="#555">one-line reason</text>
<circle cx="1280" cy="763" r="12" fill="#6a3fa0"/><text x="1280" y="767" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>
<path d="M570,437 L540,460 L540,740 L575,763" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="530" y="600" text-anchor="end" font-size="11.5" fill="#555">raises</text>
<path d="M760,795 L800,795" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M1000,795 L1040,795" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M1240,795 L1280,795" stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M1022,763 L1022,215" stroke="#1f5fa8" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
<rect x="20" y="868" width="1560" height="120" rx="6" fill="#fafafa" stroke="#ddd"/>
<text x="40" y="890" font-size="12" fill="#333"><tspan font-weight="bold">1</tspan>  A requirement starts this trail, but a discovery about the platform can start at step 4 with no requirement in sight.</text>
<text x="40" y="912" font-size="12" fill="#333"><tspan font-weight="bold">2</tspan>  Vendor proposes a design: log DEC Proposed addressing the REQ, raise an OI for our review.</text>
<text x="40" y="934" font-size="12" fill="#333"><tspan font-weight="bold">3</tspan>  Review closes the OI: DEC Accepted if a real choice was made, REQ Designed once the design covers it.</text>
<text x="40" y="956" font-size="12" fill="#333"><tspan font-weight="bold">4</tspan>  Design shows a gap: LIM Identified, introduced by the DEC. Raise an OI to assess it. Log any RSK the DEC raises.</text>
<text x="40" y="978" font-size="12" fill="#333"><tspan font-weight="bold">5</tspan>  Assess the LIM inside that OI: list its Options with impact and phase, choose one, then take that disposition path.</text>
<text x="820" y="890" font-size="12" fill="#333"><tspan font-weight="bold">6</tspan>  a Accept: a new DEC records why we live with it.  b Change now: a CR with vendor cost and time.</text>
<text x="820" y="912" font-size="12" fill="#333">    c Change later: a CR created in Deferred for a named phase.  d Resolved: the vendor fixed it, evidence noted.</text>
<text x="820" y="934" font-size="12" fill="#333"><tspan font-weight="bold">7</tspan>  CR delivered, or the vendor builds the normal path: REQ Delivered, then Verified.</text>
<text x="820" y="956" font-size="12" fill="#333"><tspan font-weight="bold">8</tspan>  Risks stay Mitigating until Retired. A Realised risk raises an OI.</text>
<text x="820" y="978" font-size="12" fill="#333"><tspan font-weight="bold">9</tspan>  Every meeting: walk Register: Outstanding. Each OI gets a next action and due date, or closes into a record.</text>
</svg>