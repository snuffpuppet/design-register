<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <rect width="1500" height="980" fill="#ffffff"/>
  <g>
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#222">Solution artifact workflow: open items drive the records, limitations must be dispositioned</text>

  <!-- Section 1: sources -->
  <text x="40" y="100" font-size="16" fill="#666" font-weight="bold">1. Where items come from</text>
  <g font-size="14" fill="#333">
    <rect x="40" y="115" width="200" height="50" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="140" y="145" text-anchor="middle">Vendor design review</text>
    <rect x="40" y="180" width="200" height="50" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="140" y="210" text-anchor="middle">Internal review / meeting</text>
    <rect x="40" y="245" width="200" height="50" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="140" y="275" text-anchor="middle">Vendor register (their ref)</text>
    <rect x="40" y="310" width="200" height="50" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="140" y="340" text-anchor="middle">Risk realised</text>
  </g>
  <path d="M240,140 L330,235" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M240,205 L330,238" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M240,270 L330,242" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M240,335 L330,245" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Section 2: open item queue -->
  <text x="340" y="100" font-size="16" fill="#666" font-weight="bold">2. The working queue (what you look at in a meeting)</text>
  <rect x="340" y="115" width="420" height="250" rx="12" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="550" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f5fa8">OPEN ITEM</text>
  <text x="550" y="168" text-anchor="middle" font-size="13" fill="#444">owner (us / vendor / joint), scope, next action, due date</text>
  <g font-size="13" fill="#333">
    <rect x="360" y="200" width="80" height="36" rx="18" fill="#fff" stroke="#1f5fa8"/>
    <text x="400" y="223" text-anchor="middle">Open</text>
    <rect x="465" y="200" width="100" height="36" rx="18" fill="#fff" stroke="#1f5fa8"/>
    <text x="515" y="223" text-anchor="middle">In progress</text>
    <rect x="590" y="200" width="80" height="36" rx="18" fill="#fff" stroke="#1f5fa8"/>
    <text x="630" y="223" text-anchor="middle">Closed</text>
    <rect x="465" y="270" width="100" height="36" rx="18" fill="#fff" stroke="#c77d00"/>
    <text x="515" y="293" text-anchor="middle">Blocked</text>
  </g>
  <path d="M440,218 L465,218" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M565,218 L590,218" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M505,236 L505,270" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M525,270 L525,236" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="550" y="345" text-anchor="middle" font-size="13" fill="#1f5fa8" font-style="italic">Rule: an item only closes by creating or changing a record</text>

  <!-- Section 3: records -->
  <text x="800" y="100" font-size="16" fill="#666" font-weight="bold">3. The records (stable registers, tagged by scope)</text>
  <g font-size="13" fill="#333">
    <rect x="800" y="115" width="320" height="58" rx="8" fill="#fff8e6" stroke="#c77d00"/>
    <text x="960" y="137" text-anchor="middle" font-weight="bold">REQUIREMENT</text>
    <text x="960" y="158" text-anchor="middle" font-size="12">Draft > Agreed > Designed > Delivered > Verified</text>

    <rect x="800" y="185" width="320" height="58" rx="8" fill="#eef7ea" stroke="#3a7d2c"/>
    <text x="960" y="207" text-anchor="middle" font-weight="bold">DECISION (ADR)</text>
    <text x="960" y="228" text-anchor="middle" font-size="12">Proposed > Accepted > Superseded | Rejected</text>

    <rect x="800" y="255" width="320" height="58" rx="8" fill="#fdecec" stroke="#b83232"/>
    <text x="960" y="277" text-anchor="middle" font-weight="bold">LIMITATION</text>
    <text x="960" y="298" text-anchor="middle" font-size="12">Identified > Under assessment > dispositioned (4)</text>

    <rect x="800" y="325" width="320" height="58" rx="8" fill="#f3eefb" stroke="#6a3fa0"/>
    <text x="960" y="347" text-anchor="middle" font-weight="bold">RISK</text>
    <text x="960" y="368" text-anchor="middle" font-size="12">Identified > Mitigating > Retired | Realised</text>

    <rect x="800" y="395" width="320" height="58" rx="8" fill="#e6f4f6" stroke="#1a7f8e"/>
    <text x="960" y="417" text-anchor="middle" font-weight="bold">CHANGE REQUEST</text>
    <text x="960" y="438" text-anchor="middle" font-size="12">Proposed | Deferred > Options > For approval > Approved > Submitted > Delivered</text>
  </g>
  <path d="M760,215 L800,150" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M760,222 L800,214" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M760,232 L800,282" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M760,245 L800,350" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M760,260 L800,418" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="1140" y="140" font-size="12" fill="#666">satisfied by decisions,</text>
  <text x="1140" y="156" font-size="12" fill="#666">constrained by limitations</text>
  <text x="1140" y="210" font-size="12" fill="#666">addresses requirements,</text>
  <text x="1140" y="226" font-size="12" fill="#666">introduces limitations / risks</text>
  <text x="1140" y="280" font-size="12" fill="#666">options chosen on the row;</text>
  <text x="1140" y="296" font-size="12" fill="#666">dispositioned by decision or CR</text>
  <text x="1140" y="350" font-size="12" fill="#666">trigger, mitigation and review date</text>
  <text x="1140" y="366" font-size="12" fill="#666">on the row; Realised spawns an open item</text>
  <text x="1140" y="420" font-size="12" fill="#666">raised only when a limitation or</text>
  <text x="1140" y="436" font-size="12" fill="#666">requirement chose to ask for a change</text>

  <!-- Section 4: limitation disposition -->
  <text x="40" y="530" font-size="16" fill="#666" font-weight="bold">4. Limitation disposition: exactly one path, each path links to a record</text>
  <rect x="40" y="560" width="180" height="56" rx="8" fill="#fdecec" stroke="#b83232"/>
  <text x="130" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Identified</text>
  <text x="130" y="603" text-anchor="middle" font-size="11" fill="#666">from decision or vendor design</text>
  <rect x="290" y="560" width="200" height="56" rx="8" fill="#fdecec" stroke="#b83232"/>
  <text x="390" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Under assessment</text>
  <text x="390" y="603" text-anchor="middle" font-size="11" fill="#666">open item raised; options listed, one chosen</text>
  <path d="M220,588 L290,588" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <g font-size="13" fill="#333">
    <rect x="620" y="560" width="170" height="56" rx="8" fill="#fff" stroke="#444"/>
    <text x="705" y="584" text-anchor="middle" font-weight="bold">Accepted</text>
    <text x="705" y="603" text-anchor="middle" font-size="11" fill="#666">we live with it, or work around it</text>
    <rect x="620" y="640" width="170" height="56" rx="8" fill="#fff" stroke="#444"/>
    <text x="705" y="664" text-anchor="middle" font-weight="bold">Change requested</text>
    <text x="705" y="683" text-anchor="middle" font-size="11" fill="#666">fix in this phase</text>
    <rect x="620" y="720" width="170" height="56" rx="8" fill="#fff" stroke="#444"/>
    <text x="705" y="744" text-anchor="middle" font-weight="bold">Change requested</text>
    <text x="705" y="763" text-anchor="middle" font-size="11" fill="#666">fix in a named later phase</text>
    <rect x="620" y="800" width="170" height="56" rx="8" fill="#fff" stroke="#444"/>
    <text x="705" y="824" text-anchor="middle" font-weight="bold">Resolved</text>
    <text x="705" y="843" text-anchor="middle" font-size="11" fill="#666">vendor fixed it / no longer applies</text>
  </g>
  <path d="M490,588 L620,588" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M490,592 C560,592 560,668 620,668" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M490,596 C560,596 560,748 620,748" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M490,600 C560,600 560,828 620,828" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <g font-size="13" fill="#333">
    <rect x="900" y="560" width="300" height="56" rx="8" fill="#eef7ea" stroke="#3a7d2c"/>
    <text x="1050" y="584" text-anchor="middle" font-weight="bold">DECISION: rationale for accepting</text>
    <text x="1050" y="603" text-anchor="middle" font-size="11" fill="#666">Accepted decision; limitation stays visible in register</text>
    <rect x="900" y="640" width="300" height="56" rx="8" fill="#e6f4f6" stroke="#1a7f8e"/>
    <text x="1050" y="664" text-anchor="middle" font-weight="bold">CHANGE REQUEST (this phase)</text>
    <text x="1050" y="683" text-anchor="middle" font-size="11" fill="#666">limitation status follows the CR; vendor ref, $ and time</text>
    <rect x="900" y="720" width="300" height="56" rx="8" fill="#e6f4f6" stroke="#1a7f8e"/>
    <text x="1050" y="744" text-anchor="middle" font-weight="bold">CHANGE REQUEST (Deferred, named phase)</text>
    <text x="1050" y="763" text-anchor="middle" font-size="11" fill="#666">waits for phase planning; on the next-phase view</text>
    <rect x="900" y="800" width="300" height="56" rx="8" fill="#f3f3f3" stroke="#bbb"/>
    <text x="1050" y="824" text-anchor="middle" font-weight="bold">Closed, evidence noted</text>
    <text x="1050" y="843" text-anchor="middle" font-size="11" fill="#666">link to vendor item or design version</text>
  </g>
  <path d="M790,588 L900,588" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M790,668 L900,668" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M790,748 L900,748" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M790,828 L900,828" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Scope note -->
  <rect x="40" y="890" width="1420" height="80" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="60" y="915" font-size="13" fill="#333" font-weight="bold">Scope tagging</text>
  <text x="60" y="936" font-size="12" fill="#555">Domain > Technical service (delivery, access) > Customer service (a composition of technical services). Each item is tagged once at the lowest scope that applies. No programme level: the registers sit inside the programme area.</text>
  <text x="60" y="956" font-size="12" fill="#555">A customer-service view is the union of its component services plus items tagged at the customer-service level.</text>
  </g>
</svg>
